<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081d2b">
  <meta name="description" content="BUSINESS CHINE — portail mobile de la mission commerciale du 23 novembre au 6 décembre 2026.">
  <title>BUSINESS CHINE · Mission 2026</title>
  <link rel="preload" as="image" href="assets/mission-route-decorative.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navigation principale">
      <a class="brand" href="#mission" data-route="mission" aria-label="BUSINESS CHINE, accueil">
        <span class="brand-mark" aria-hidden="true">BC</span>
        <span><strong>BUSINESS CHINE</strong><small>Mission 2026 · accès public</small></span>
      </a>
      <nav id="nav"></nav>
      <div class="side-actions">
        <button id="modeToggle" class="mode-toggle" type="button" aria-pressed="false"><span aria-hidden="true">◐</span><span>Mode présentation</span></button>
        <button id="exportProject" class="quiet-button" type="button">Exporter le projet</button>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <header class="topbar">
        <div><span class="live-dot" aria-hidden="true"></span><span id="saveStatus">Données enregistrées localement</span></div>
        <div class="top-actions">
          <label class="search"><span class="sr-only">Rechercher</span><input id="globalSearch" type="search" placeholder="Rechercher dans BUSINESS CHINE"></label>
          <button id="printPresentation" type="button">Imprimer</button>
        </div>
      </header>
      <div id="page" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
